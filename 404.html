<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 — Happy Booth</title>

  <script>
    (function () {
      var aliases = {
        '/baogia': '/price'
      };
      var path = window.location.pathname.replace(/\/+$/, '').toLowerCase();
      if (aliases[path]) {
        window.location.replace(aliases[path] + window.location.search + window.location.hash);
      } else if (/^\/[2-9a-hjkmnp-z]{10}$/.test(path)) {
        // A photo album short link (happybooth.vn/<code>). Same pattern as
        // SHORT_PATH_RE in assets/js/album-core.js; a test keeps the two in step.
        window.location.replace('/album?c=' + path.slice(1));
      }
    })();
  </script>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .not-found {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px var(--gutter);
    }
    .not-found__brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
      font: 800 22px/1 var(--font-display);
      letter-spacing: -0.03em;
    }
    .not-found__brand img { width: 36px; height: 36px; border-radius: 9px; }
    .not-found__code {
      font-size: clamp(7rem, 20vw, 14rem);
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: var(--color-pink);
    }
    .not-found__title {
      margin: 20px 0 12px;
      font: 600 clamp(24px, 3vw, 34px)/1.15 var(--font-display);
      letter-spacing: -0.02em;
    }
    .not-found__title em { font-style: normal; }
    .not-found__text {
      max-width: 30em;
      margin: 0 auto 32px;
      color: var(--color-text-light);
    }
    .not-found__actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .not-found__divider { display: none; }
  </style>
</head>
<body>
  <main class="not-found">
    <a href="/" class="not-found__brand">
      <img src="/assets/icons/logo.svg" alt="">
      Happy Booth
    </a>
    <h1 class="not-found__code">404</h1>
    <div class="not-found__divider"></div>
    <p class="not-found__title"><em>Trang không tồn tại</em></p>
    <p class="not-found__text">Có vẻ như đường dẫn bạn vừa truy cập không còn hoặc chưa bao giờ tồn tại. Mời bạn quay về trang chủ hoặc xem bảng giá dịch vụ.</p>
    <div class="not-found__actions">
      <a href="/" class="btn btn--pink">Về trang chủ</a>
      <a href="/price" class="btn">Xem báo giá</a>
    </div>
  </main>
</body>
</html>
