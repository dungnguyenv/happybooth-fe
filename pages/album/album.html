<!DOCTYPE html>
<html lang="vi" data-brand="pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- Photos, clips and album data only ever come from the API (localhost:8010 is the backend's docker compose). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://api.happybooth.vn http://localhost:8010; media-src https://api.happybooth.vn http://localhost:8010; connect-src https://api.happybooth.vn http://localhost:8010; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#FFFFFF">
  <title>Ảnh của bạn — Happy Booth</title>
  <meta name="description" content="Xem và tải ảnh photobooth của bạn từ Happy Booth.">
  <meta property="og:title" content="Ảnh của bạn — Happy Booth">
  <meta property="og:description" content="Xem và tải ảnh photobooth của bạn từ Happy Booth.">
  <meta property="og:image" content="https://happybooth.vn/assets/images/og-cover.jpg">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.happybooth.vn" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Album page CSS lives here, like 404.html, so style.css (and its cache key) stays untouched. -->
  <style>
    :root {
      --album-bar: 64px;
      --album-stage-h: min(72vh, 820px);
      --album-thumb: 80px;
      /* Partner branding. HappyBooth pink until /page says otherwise: album.js then sets
         --brand and --brand-ink inline and data-theme on <html>. Every colour below has
         the HappyBooth value as its default, so an unbranded page is drawn as before. */
      --brand: var(--color-pink);
      --brand-ink: #fff;
      --album-accent: var(--brand);
      --album-accent-soft: rgba(255, 44, 104, 0.25);
      --album-surface: #fff;
      --album-float-ink: var(--color-text);
      --album-bar-bg: rgba(255, 255, 255, 0.94);
      --album-bar-ink: var(--color-text);
      --album-bar-border: var(--color-border);
      --album-btn-bg: #fff;
      --album-btn-border: var(--color-border);
      --album-skel-a: #e9e9e9;
      --album-skel-b: #f7f7f7;
      --album-card-radius: calc(var(--radius) + 6px);
      --album-round: 50%;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }
    [hidden] { display: none !important; }

    /* ---------- Top bar ---------- */
    .album-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--album-bar);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 var(--gutter);
      background: var(--album-bar-bg);
      color: var(--album-bar-ink);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--album-bar-border);
    }
    .album-bar__brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      font: 800 20px/1 var(--font-display);
      letter-spacing: -0.03em;
      color: var(--album-bar-ink);
    }
    .album-bar__brand img { width: 32px; height: 32px; border-radius: 8px; }
    .album-bar__sep { color: var(--color-border); font-size: 22px; flex-shrink: 0; }
    .album-bar__title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font: 600 18px/1.2 var(--font-display);
      letter-spacing: -0.01em;
    }
    .album-bar__actions { display: flex; gap: 8px; flex-shrink: 0; }
    .album-icon-btn {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--album-btn-border);
      border-radius: var(--album-round);
      background: var(--album-btn-bg);
      color: var(--album-bar-ink);
      cursor: pointer;
      transition: color var(--transition-speed), border-color var(--transition-speed), background var(--transition-speed);
    }
    .album-icon-btn:hover:not(:disabled) { color: var(--album-accent); border-color: var(--album-accent); }
    .album-icon-btn:disabled { opacity: 0.35; cursor: default; }
    .album-icon-btn:focus-visible,
    .album-nav:focus-visible,
    .album-play:focus-visible,
    .album-thumb:focus-visible { outline: 3px solid var(--album-accent); outline-offset: 2px; }

    /* ---------- Stage ---------- */
    .album-main { flex: 1; display: flex; flex-direction: column; }
    .album-stage {
      position: relative;
      height: var(--album-stage-h);
      display: grid;
      place-items: center;
      padding: 24px 88px;
      background: var(--color-stone);
      overflow: hidden;
      /* Vertical scroll and pinch-zoom stay native; horizontal swipes change photos. */
      touch-action: pan-y pinch-zoom;
    }
    .album-photo { position: relative; display: flex; max-width: 100%; max-height: 100%; }
    .album-photo img {
      display: block;
      max-width: 100%;
      max-height: calc(var(--album-stage-h) - 48px);
      width: auto;
      height: auto;
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(26, 26, 26, 0.16);
      background: #fff;
      transition: opacity 0.2s ease;
    }
    .album-photo img.is-fading { opacity: 0; }
    /* Sized like the photo: before metadata loads, the poster (the clip's first
       frame, already cached from its thumbnail) gives the box its shape. */
    .album-photo video {
      display: block;
      max-width: 100%;
      max-height: calc(var(--album-stage-h) - 48px);
      width: auto;
      height: auto;
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(26, 26, 26, 0.16);
      background: #000;
    }
    .album-play {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 1px solid var(--color-border);
      border-radius: var(--album-round);
      background: var(--album-surface);
      color: var(--album-float-ink);
      box-shadow: 0 10px 30px rgba(26, 26, 26, 0.22);
      cursor: pointer;
      transition: color var(--transition-speed), border-color var(--transition-speed);
    }
    .album-play svg { margin-left: 4px; }
    .album-play:hover { color: var(--album-accent); border-color: var(--album-accent); }
    .album-video-error {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      margin: 0;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: rgba(26, 26, 26, 0.85);
      color: #fff;
      font: 600 14px/1.4 var(--font-sans);
      text-align: center;
    }
    .album-counter {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(26, 26, 26, 0.85);
      color: #fff;
      font: 600 14px/1.2 var(--font-sans);
      font-variant-numeric: tabular-nums;
    }
    .album-pending {
      position: relative;
      width: min(420px, 100%);
      aspect-ratio: 2 / 3;
      max-height: calc(var(--album-stage-h) - 48px);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 16px;
      padding: 24px;
      border-radius: var(--radius);
      background: var(--color-blush);
      text-align: center;
      font-weight: 600;
    }
    .album-nav {
      position: absolute;
      top: 50%;
      z-index: 2;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border: 1px solid var(--color-border);
      border-radius: var(--album-round);
      background: var(--album-surface);
      color: var(--album-float-ink);
      cursor: pointer;
      transition: color var(--transition-speed), border-color var(--transition-speed);
    }
    .album-nav:hover { color: var(--album-accent); border-color: var(--album-accent); }
    .album-nav--prev { left: 20px; }
    .album-nav--next { right: 20px; }

    /* ---------- Messages (empty, expired, not found…) ---------- */
    .album-message {
      max-width: 520px;
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
    }
    .album-message__art {
      width: min(360px, 80vw);
      max-height: calc(var(--album-stage-h) - 220px);
      object-fit: cover;
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(26, 26, 26, 0.12);
    }
    .album-message__art--logo { width: 88px; height: 88px; box-shadow: none; border-radius: 20px; }
    .album-message__title {
      margin: 6px 0 0;
      font: 800 clamp(24px, 3vw, 34px)/1.1 var(--font-display);
      letter-spacing: -0.02em;
    }
    .album-message__text { margin: 0; color: var(--color-text-light); }
    .album-message .btn { margin-top: 6px; }

    .album-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid var(--album-accent-soft);
      border-top-color: var(--album-accent);
      animation: album-spin 0.9s linear infinite;
    }
    @keyframes album-spin { to { transform: rotate(360deg); } }

    .album-skeleton {
      width: min(380px, 70vw);
      aspect-ratio: 2 / 3;
      max-height: calc(var(--album-stage-h) - 48px);
      border-radius: var(--radius);
      background: linear-gradient(100deg, var(--album-skel-a) 30%, var(--album-skel-b) 50%, var(--album-skel-a) 70%);
      background-size: 300% 100%;
      animation: album-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes album-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

    /* ---------- Thumbnails ---------- */
    .album-strip { padding: 18px var(--gutter) 6px; }
    .album-thumbs {
      display: flex;
      gap: 12px;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 4px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      list-style: none;
    }
    .album-thumb {
      position: relative;
      flex: 0 0 auto;
      width: var(--album-thumb);
      height: var(--album-thumb);
      padding: 0;
      border: 2px solid transparent;
      border-radius: var(--radius);
      background: var(--color-stone);
      overflow: hidden;
      cursor: pointer;
      transition: border-color var(--transition-speed), transform var(--transition-speed);
    }
    .album-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .album-thumb[aria-current="true"] { border-color: var(--album-accent); transform: translateY(-2px); }
    .album-thumb__badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(26, 26, 26, 0.85);
      color: #fff;
      font: 700 10px/1.2 var(--font-sans);
      letter-spacing: 0.02em;
    }
    .album-thumb--pending {
      display: grid;
      place-items: center;
      background: var(--color-blush);
      color: var(--color-text-soft);
      font: 600 11px/1.2 var(--font-sans);
    }
    .album-thumb--pending::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
      background-size: 300% 100%;
      animation: album-shimmer 1.4s ease-in-out infinite;
    }
    .album-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 12px 0 0;
      color: var(--color-text-light);
      font-size: 14px;
    }
    .album-progress__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--album-accent);
      animation: album-pulse 1.2s ease-in-out infinite;
    }
    @keyframes album-pulse { 50% { opacity: 0.25; } }

    .album-notice {
      max-width: 720px;
      margin: 14px auto 0;
      padding: 12px 18px;
      border-radius: var(--radius);
      background: var(--color-blush);
      text-align: center;
      font-size: 15px;
    }
    .album-notice a { font-weight: 700; color: var(--color-text); }

    /* ---------- Event card + footer ---------- */
    .album-event {
      width: min(960px, calc(100% - 2 * var(--gutter)));
      margin: 28px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 280px) 1fr;
      gap: 28px;
      align-items: center;
      padding: 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--album-card-radius);
    }
    .album-event--no-banner { grid-template-columns: 1fr; }
    .album-event__banner { width: 100%; border-radius: var(--radius); display: block; }
    .album-event__name { margin: 0; font: 800 26px/1.15 var(--font-display); letter-spacing: -0.02em; }
    .album-event__desc { margin: 8px 0 0; color: var(--color-text-light); }
    .album-event__expiry { margin: 12px 0 18px; font-size: 14px; color: var(--color-text-light); }
    .album-footer {
      margin-top: 32px;
      padding: 22px var(--gutter) 28px;
      text-align: center;
      font-size: 14px;
      color: var(--color-text-light);
    }
    .album-footer a { color: var(--color-text); font-weight: 600; }
    .album-footer__powered { margin-top: 6px; font-size: 12px; opacity: 0.75; }
    .album-event--no-cta .album-event__expiry { margin-bottom: 0; }
    .album-event__social { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .album-event .btn + .album-event__social { margin-top: 18px; }
    .album-event__social a {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--brand);
      border-radius: var(--album-round);
      color: var(--brand);
      transition: background var(--transition-speed), color var(--transition-speed);
    }
    .album-event__social a:hover { background: var(--brand); color: var(--brand-ink); }
    .album-event__social a:focus-visible { outline: 3px solid var(--album-accent); outline-offset: 2px; }

    /* ---------- Partner banners (3:1 carousel) and sponsors ---------- */
    .album-ads,
    .album-sponsors { width: min(960px, calc(100% - 2 * var(--gutter))); margin: 22px auto 0; }
    .album-ads__frame {
      position: relative;
      aspect-ratio: 3 / 1;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--color-stone);
      /* Vertical scroll stays native; horizontal swipes change the banner. */
      touch-action: pan-y pinch-zoom;
    }
    .album-ads__track {
      display: flex;
      height: 100%;
      list-style: none;
      transition: transform 0.4s ease;
    }
    .album-ads__slide { flex: 0 0 100%; height: 100%; }
    .album-ads__slide a { display: block; height: 100%; }
    .album-ads__slide img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .album-ads__slide a:focus-visible { outline: 3px solid var(--album-accent); outline-offset: -3px; }
    .album-ads__tag {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(26, 26, 26, 0.6);
      color: #fff;
      font: 700 10px/1.5 var(--font-sans);
      letter-spacing: 0.06em;
      pointer-events: none;
    }
    .album-ads__dots { display: flex; justify-content: center; margin-top: 4px; }
    .album-ads__dot {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .album-ads__dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-border);
    }
    .album-ads__dot[aria-current="true"]::before { background: var(--album-accent); }
    .album-ads__dot:focus-visible { outline: 3px solid var(--album-accent); outline-offset: -4px; border-radius: 50%; }
    .album-sponsors { margin-top: 28px; text-align: center; }
    .album-sponsors__title {
      margin: 0 0 12px;
      color: var(--color-text-light);
      font: 600 12px/1.3 var(--font-sans);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .album-sponsors__list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; list-style: none; }
    .album-sponsors__item {
      flex: 1 1 96px;
      max-width: 150px;
      height: 64px;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: #fff;
    }
    .album-sponsors__link { width: 100%; height: 100%; display: grid; place-items: center; padding: 8px 12px; }
    .album-sponsors__link img { display: block; max-width: 100%; max-height: 44px; object-fit: contain; }
    a.album-sponsors__link:focus-visible { outline: 3px solid var(--album-accent); outline-offset: -3px; }

    /* ---------- Partner branding in the top bar, messages and footer ---------- */
    .album-bar__brand .album-bar__logo { width: auto; height: auto; max-width: 140px; max-height: 32px; border-radius: 0; object-fit: contain; }
    .album-bar__org {
      min-width: 0;
      max-width: 42vw;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font: 800 18px/1.1 var(--font-display);
      letter-spacing: -0.02em;
    }
    .album-message .album-message__art--partner { width: auto; height: auto; max-width: 200px; max-height: 88px; box-shadow: none; border-radius: 0; object-fit: contain; }

    /* While /page is pending (3 s at most) everything that depends on the brand is a
       neutral grey block of its final size, so nothing jumps or flashes the wrong brand. */
    html[data-brand="pending"] { --brand: #c8c8c8; }
    html[data-brand="pending"],
    html[data-brand="brand"] { --album-accent-soft: color-mix(in srgb, var(--album-accent) 25%, transparent); }
    .is-skel { background: rgba(128, 128, 128, 0.16); border-radius: 8px; }
    .is-skel > * { visibility: hidden; }
    html[data-brand="pending"] .album-bar__brand { background: rgba(128, 128, 128, 0.16); border-radius: 8px; }
    html[data-brand="pending"] .album-bar__brand > * { visibility: hidden; }
    html[data-brand="pending"] .album-event .btn {
      background: rgba(128, 128, 128, 0.16);
      box-shadow: none;
      color: transparent;
      pointer-events: none;
    }
    html[data-brand="pending"] .album-footer { position: relative; }
    html[data-brand="pending"] .album-footer > * { visibility: hidden; }
    html[data-brand="pending"] .album-footer::after {
      content: "";
      position: absolute;
      top: 24px;
      left: 50%;
      width: min(260px, 70%);
      height: 16px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: rgba(128, 128, 128, 0.16);
    }
    html[data-brand="pending"] .album-notice { background: rgba(128, 128, 128, 0.16); }
    html[data-brand="pending"] .album-notice > * { visibility: hidden; }

    html[data-brand="brand"] .album-event .btn--pink { background: var(--brand); color: var(--brand-ink); }
    html[data-brand="brand"] .album-event .btn--pink:hover { background: color-mix(in srgb, var(--brand) 86%, #000); }
    html[data-brand="brand"] :is(.album-message__text, .album-notice) a { white-space: nowrap; }

    /* Branded waiting and expired pages: the message is as tall as it is, banners follow. */
    html[data-brand="brand"] .album-main[data-state="empty"] .album-stage,
    html[data-brand="brand"] .album-main[data-state="expired"] .album-stage {
      height: auto;
      padding: 36px 16px 8px;
    }

    /* ---------- Themes (data-theme, set by album.js from /page) ---------- */
    html[data-theme="light"] {
      --color-blush: color-mix(in srgb, var(--brand) 12%, #fff);
      --album-bar-bg: var(--brand);
      --album-bar-ink: var(--brand-ink);
      --album-bar-border: transparent;
      --album-btn-bg: transparent;
      --album-btn-border: color-mix(in srgb, var(--brand-ink) 45%, transparent);
    }
    html[data-theme="light"] .album-icon-btn:hover:not(:disabled) {
      color: var(--brand-ink);
      border-color: var(--brand-ink);
      background: color-mix(in srgb, var(--brand-ink) 14%, transparent);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --color-bg: #141414;
      --color-text: #f2f2f2;
      --color-text-light: #b8b8b8;
      --color-text-soft: #d0d0d0;
      --color-stone: #0b0b0b;
      --color-blush: #242424;
      --color-border: #2f2f2f;
      --album-surface: #1f1f1f;
      --album-bar-bg: #141414;
      --album-btn-bg: #1f1f1f;
      --album-btn-border: #3a3a3a;
      --album-skel-a: #1c1c1c;
      --album-skel-b: #2a2a2a;
    }
    html[data-theme="dark"] .album-bar { border-bottom: 3px solid var(--brand); }
    html[data-theme="dark"] .album-photo img { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6); }

    html[data-theme="minimal"] {
      --color-bg: #fbfaf7;
      --color-text: #222;
      --color-text-light: #5e5a52;
      --color-text-soft: #3a3833;
      --color-stone: #fbfaf7;
      --color-blush: #f1eee7;
      --color-border: #e6e2da;
      --radius: 0px;
      --album-card-radius: 0px;
      --album-round: 0px;
      --album-surface: #fbfaf7;
      --album-bar-bg: #fbfaf7;
      --album-btn-bg: transparent;
      --album-btn-border: #c9c4b8;
      --album-skel-a: #eeebe3;
      --album-skel-b: #f7f5f0;
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    }
    html[data-theme="minimal"] .album-photo img { box-shadow: 0 10px 30px rgba(34, 34, 34, 0.1); }
    html[data-theme="minimal"] .album-bar__org { font-weight: 600; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; }
    html[data-theme="minimal"] :is(.album-bar__title, .album-event__name, .album-message__title) { font-weight: 500; letter-spacing: 0; }
    html[data-theme="minimal"] .album-event .btn {
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--brand);
      color: var(--brand);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    html[data-theme="minimal"] .album-event .btn:hover { background: var(--brand); color: var(--brand-ink); }

    html[data-theme="vivid"] {
      --color-text: var(--brand-ink);
      --color-text-soft: var(--brand-ink);
      --color-text-light: color-mix(in srgb, var(--brand-ink) 84%, transparent);
      --color-border: color-mix(in srgb, var(--brand-ink) 35%, transparent);
      --color-stone: transparent;
      --color-blush: rgba(255, 255, 255, 0.22);
      --album-accent: var(--brand-ink);
      --album-float-ink: #1a1a1a;
      --album-card-radius: 20px;
      --album-bar-bg: transparent;
      --album-bar-border: transparent;
      --album-btn-bg: transparent;
      --album-btn-border: color-mix(in srgb, var(--brand-ink) 50%, transparent);
      --album-skel-a: rgba(255, 255, 255, 0.18);
      --album-skel-b: rgba(255, 255, 255, 0.34);
    }
    html[data-theme="vivid"] body {
      background: linear-gradient(170deg, var(--brand) 0%, color-mix(in srgb, var(--brand) 78%, #fff) 100%);
    }
    html[data-theme="vivid"] .album-bar { backdrop-filter: none; }
    html[data-theme="vivid"] .album-icon-btn:hover:not(:disabled) {
      color: var(--brand-ink);
      border-color: var(--brand-ink);
      background: color-mix(in srgb, var(--brand-ink) 14%, transparent);
    }
    html[data-theme="vivid"] .album-photo img { box-shadow: 0 0 0 4px #fff, 0 18px 50px rgba(26, 26, 26, 0.28); }
    html[data-theme="vivid"] .album-thumb { background: rgba(255, 255, 255, 0.2); }
    html[data-theme="vivid"] .album-thumb[aria-current="true"] { border-color: #fff; }
    html[data-theme="vivid"] .album-ads__frame { background: #fff; }
    /* Content sits on white cards; the accent is the brand colour again inside them. */
    html[data-theme="vivid"] :is(.album-event, .album-sponsors, .album-notice),
    html[data-theme="vivid"] .album-main[data-state="empty"] .album-message,
    html[data-theme="vivid"] .album-main[data-state="expired"] .album-message {
      --color-text: #1a1a1a;
      --color-text-light: #555;
      --color-border: #e1e1e1;
      --color-blush: #f4f4f4;
      --album-accent: var(--brand);
      --album-accent-soft: color-mix(in srgb, var(--brand) 25%, transparent);
      background: #fff;
      color: #1a1a1a;
    }
    html[data-theme="vivid"] .album-sponsors { padding: 16px; border-radius: var(--album-card-radius); }
    html[data-theme="vivid"] .album-message { padding: 24px 20px; border-radius: var(--album-card-radius); }
    html[data-theme="vivid"] .album-notice { border-radius: 14px; }


    .album-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 30;
      transform: translate(-50%, 20px);
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--color-text);
      color: #fff;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .album-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    .album-toast.is-url { max-width: calc(100vw - 32px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* State switches: the main element carries data-state. */
    .album-main:not([data-state="partial"]):not([data-state="complete"]) .album-photo,
    .album-main:not([data-state="partial"]):not([data-state="complete"]) .album-nav { display: none; }
    .album-main[data-state="loading"] .album-strip,
    .album-main[data-state="not_found"] .album-strip,
    .album-main[data-state="expired"] .album-strip,
    .album-main[data-state="error"] .album-strip,
    .album-main[data-state="not_found"] .album-event,
    .album-main[data-state="error"] .album-event,
    .album-main[data-state="loading"] .album-event,
    .album-main[data-state="not_found"] :is(.album-ads, .album-sponsors),
    .album-main[data-state="error"] :is(.album-ads, .album-sponsors),
    .album-main[data-state="loading"] :is(.album-ads, .album-sponsors) { display: none; }

    @media (max-width: 960px) {
      :root { --album-bar: 56px; --album-stage-h: min(66vh, 640px); --album-thumb: 64px; }
      .album-bar { gap: 10px; }
      .album-bar__brand span, .album-bar__sep { display: none; }
      .album-bar__title { font-size: 16px; }
      .album-bar__brand .album-bar__logo { max-width: 110px; }
      .album-bar__org { max-width: 34vw; font-size: 16px; }
      html[data-theme="minimal"] .album-bar__org { font-size: 13px; letter-spacing: 0.1em; }
      .album-stage { padding: 12px; }
      .album-nav { display: none !important; }
      .album-event { grid-template-columns: 1fr; gap: 16px; padding: 18px; }
      .album-event__name { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .album-photo img, .album-thumbs, .album-toast, .album-play, .album-ads__track { transition: none; scroll-behavior: auto; }
      .album-spinner, .album-skeleton, .album-thumb--pending::before, .album-progress__dot { animation: none; }
    }
  </style>
</head>
<body>
  <header class="album-bar">
    <a href="/" class="album-bar__brand" aria-label="Happy Booth — trang chủ">
      <img src="/assets/icons/logo.svg" alt="" width="32" height="32">
      <span>Happy Booth</span>
    </a>
    <span class="album-bar__sep" aria-hidden="true">/</span>
    <h1 class="album-bar__title" data-album-title>Ảnh của bạn</h1>
    <div class="album-bar__actions">
      <button type="button" class="album-icon-btn" data-album-download aria-label="Tải file gốc" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button type="button" class="album-icon-btn" data-album-share aria-label="Chia sẻ link album">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>
      </button>
    </div>
  </header>

  <main class="album-main" id="album" data-state="loading">
    <section class="album-stage" data-album-stage aria-label="Ảnh đang xem">
      <button type="button" class="album-nav album-nav--prev" data-album-prev aria-label="Ảnh trước">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>

      <div class="album-photo" data-album-photo>
        <img data-album-image alt="" decoding="async">
        <video data-album-video playsinline preload="none" hidden></video>
        <button type="button" class="album-play" data-album-play aria-label="Phát video" hidden>
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
        </button>
        <p class="album-video-error" data-album-video-error hidden>Trình duyệt không phát được video này. Bấm nút tải để xem trên máy.</p>
        <span class="album-counter" data-album-counter aria-live="polite"></span>
      </div>

      <div class="album-message" data-album-message>
        <div class="album-skeleton" aria-hidden="true"></div>
      </div>

      <button type="button" class="album-nav album-nav--next" data-album-next aria-label="Ảnh sau">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </section>

    <section class="album-strip" aria-label="Danh sách ảnh">
      <ul class="album-thumbs" data-album-thumbs></ul>
      <p class="album-progress" data-album-progress aria-live="polite"></p>
      <p class="album-notice" data-album-notice hidden></p>
    </section>

    <section class="album-ads" data-album-ads aria-label="Quảng cáo" hidden>
      <div class="album-ads__frame" data-album-ads-frame>
        <ul class="album-ads__track" data-album-ads-track></ul>
        <span class="album-ads__tag" aria-hidden="true">QC</span>
      </div>
      <div class="album-ads__dots" data-album-ads-dots></div>
    </section>

    <section class="album-event" data-album-event>
      <img class="album-event__banner" data-album-banner alt="" hidden>
      <div>
        <h2 class="album-event__name" data-album-event-name></h2>
        <p class="album-event__desc" data-album-event-desc hidden></p>
        <p class="album-event__expiry" data-album-expiry></p>
        <a href="/price" class="btn btn--pink" data-album-cta>Thuê photobooth cho sự kiện của bạn</a>
        <div class="album-event__social" data-album-social hidden></div>
      </div>
    </section>

    <section class="album-sponsors" data-album-sponsors aria-label="Nhà tài trợ" hidden>
      <h3 class="album-sponsors__title">Đồng hành cùng sự kiện</h3>
      <ul class="album-sponsors__list" data-album-sponsors-list></ul>
    </section>
  </main>

  <footer class="album-footer" data-album-footer><div class="album-footer__line">
    © Happy Booth · Hotline <a href="tel:+84971842329">0971 842 329</a> · <a href="/">happybooth.vn</a>
  </div></footer>

  <div class="album-toast" data-album-toast role="status" aria-live="polite"></div>

  <script src="/assets/js/album-core.js"></script>
  <script src="/assets/js/album.js" defer></script>
</body>
</html>
